plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mamali.cloudagy'
    compileSdk 36

    defaultConfig {
        applicationId "com.mamali.cloudagy"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "1.1.0"
    }

    signingConfigs {
        release {
            def ksFile = file("upload-keystore.jks")
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("STORE_PASSWORD") ?: "gbyDsoLSvl6zs8tFwaS8"
                keyAlias System.getenv("KEY_ALIAS") ?: "upload"
                keyPassword System.getenv("KEY_PASSWORD") ?: "gbyDsoLSvl6zs8tFwaS8"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            if (file("upload-keystore.jks").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
