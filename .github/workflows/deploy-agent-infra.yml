name: Deploy Cloud Agent Infrastructure & PWA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Account-Level WIF
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/202076903469/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider' }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT || 'play-upload@project-51459e90-fbb3-471f-9f9.iam.gserviceaccount.com' }}
          access_token_scopes: 'https://www.googleapis.com/auth/cloud-platform'

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build & Push Slim Container Image (~95MB) with BuildKit Layer Cache
        run: |
          echo "${{ steps.gcp-auth.outputs.access_token }}" | docker login -u oauth2accesstoken --password-stdin https://us-central1-docker.pkg.dev
          IMAGE_BASE="us-central1-docker.pkg.dev/project-51459e90-fbb3-471f-9f9/agy-agent-repo/agy-orchestrator"
          docker pull $IMAGE_BASE:latest || true
          docker build --cache-from $IMAGE_BASE:latest -t $IMAGE_BASE:latest -t $IMAGE_BASE:${{ github.sha }} ./agent-service
          docker push $IMAGE_BASE:latest
          docker push $IMAGE_BASE:${{ github.sha }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Ensure Terraform State Bucket Exists
        run: |
          gcloud storage buckets describe gs://project-51459e90-fbb3-471f-9f9-tfstate >/dev/null 2>&1 || \
            gcloud storage buckets create gs://project-51459e90-fbb3-471f-9f9-tfstate \
              --project=project-51459e90-fbb3-471f-9f9 --location=us-central1 --uniform-bucket-level-access

      - name: Terraform Init & Apply
        working-directory: ./terraform
        env:
          TF_VAR_image_tag: ${{ github.sha }}
        run: |
          terraform init
          # Adopt resources created by earlier runs that had no remote state
          adopt() { terraform state list | grep -qx "$1" || terraform import "$1" "$2" || true; }
          adopt google_storage_bucket.agent_cache project-51459e90-fbb3-471f-9f9-agy-repo-cache
          adopt google_cloud_run_v2_service.agy_service projects/project-51459e90-fbb3-471f-9f9/locations/us-central1/services/agy-cloud-orchestrator
          terraform apply -auto-approve
          terraform output

      - name: Verify Cloud Run Service & Health Check
        run: |
          SERVICE_URL=$(gcloud run services describe agy-cloud-orchestrator --region=us-central1 --project=project-51459e90-fbb3-471f-9f9 --format='value(status.url)')
          echo "=================================================="
          echo "CLOUD_RUN_SERVICE_URL: $SERVICE_URL"
          echo "CLOUD_RUN_WEBHOOK_URL: $SERVICE_URL/chat"
          echo "=================================================="
          echo "### 🚀 Cloud Run Service Endpoint" >> $GITHUB_STEP_SUMMARY
          echo "- **Base URL:** \`$SERVICE_URL\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Webhook URL:** \`$SERVICE_URL/chat\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Check:** \`$SERVICE_URL/health\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Web PWA:** https://aminniktash2010.github.io/cloud-agy-orchestrator/" >> $GITHUB_STEP_SUMMARY

          echo "Pinging Cloud Run /health..."
          curl -f -sS "$SERVICE_URL/health"
          echo ""

  deploy-chat-pwa:
    needs: deploy-infra
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Web Chat PWA Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web-chat-pwa'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
