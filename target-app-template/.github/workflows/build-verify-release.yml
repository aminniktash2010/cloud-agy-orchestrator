name: Verify, Stage Preview & Developer Test Release

on:
  push:
    branches: ["main", "agy/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

jobs:
  # =========================================================================
  # STAGE 1: STATIC ANALYSIS, UNIT TESTS, BUILD & WEB STAGING PREVIEW
  # =========================================================================
  verify-and-stage-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Install Dependencies & Run Verification Checks
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      # Self-Healing: If an `agy/*` branch fails tests, send compiler logs back to Cloud Run
      - name: Trigger Cloud Run Agent Self-Heal on Failure
        if: failure() && startsWith(github.ref_name, 'agy/')
        run: |
          curl -X POST "${{ vars.AGY_CLOUD_RUN_URL }}/chat" \
            -H "Content-Type: application/json" \
            -H "x-webhook-token: ${{ secrets.WEBHOOK_SECRET }}" \
            -d "{
              \"repo\": \"${{ github.event.repository.name }}\",
              \"branch\": \"${{ github.ref_name }}\",
              \"prompt\": \"CI flutter analyze/test failed on branch ${{ github.ref_name }}. Fix the compiler errors and push.\"
            }"

      - name: Build Web Preview & Release Android App Bundle (.aab)
        if: github.ref_name == 'main'
        run: |
          flutter build web --release
          flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Sign Release Bundle for Developer Test Track
        if: github.ref_name == 'main'
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
        run: |
          python3 tools/play_console_cli.py sign --bundle build/app/outputs/bundle/release/app-release.aab

      - name: Upload Signed AAB Artifact for Developer Test Gate
        if: github.ref_name == 'main'
        uses: actions/upload-artifact@v4
        with:
          name: signed-dev-test-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Upload & Deploy Interactive Web Preview to GitHub Pages
        if: github.ref_name == 'main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      - name: Publish Web Staging Preview
        if: github.ref_name == 'main'
        uses: actions/deploy-pages@v4

  # =========================================================================
  # STAGE 2: 1-TAP APPROVAL GATE FOR PLAY CONSOLE DEVELOPER TEST (INTERNAL)
  # =========================================================================
  deploy-play-developer-test:
    needs: verify-and-stage-preview
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    # Pauses for 1-tap approval under Settings > Environments > `play-internal-test`
    environment:
      name: play-internal-test
    steps:
      - name: Checkout Tools
        uses: actions/checkout@v4

      - name: Download Signed AAB from Staging Job
        uses: actions/download-artifact@v4
        with:
          name: signed-dev-test-aab
          path: ./release-artifact

      - name: Authenticate to Google Cloud via Account-Level WIF
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/202076903469/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider' }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT || 'play-upload@project-51459e90-fbb3-471f-9f9.iam.gserviceaccount.com' }}
          access_token_scopes: 'https://www.googleapis.com/auth/androidpublisher'

      - name: Deploy Approved Build to Google Play [INTERNAL DEVELOPER TEST TRACK]
        run: |
          python3 tools/play_console_cli.py deploy --track internal --bundle ./release-artifact/app-release.aab
