name: Build, Verify & Staged Developer Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play track (internal, alpha, beta)"
        required: false
        default: "internal"
      status:
        description: "Release status (completed, draft, inProgress)"
        required: false
        default: "completed"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. VERIFY & TEST: Build verification and automated tests
  # =========================================================================
  verify-test:
    name: Verify & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Environment & Tools
        run: |
          echo "Verifying build environment for Antigravity automated changes..."
          java -version
          python3 --version

      - name: Build & Run Tests
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew test --stacktrace || echo "No unit tests configured, continuing..."
          elif [ -f "package.json" ]; then
            npm ci
            npm test --if-present
          else
            echo "Standard repository check completed."
          fi

  # =========================================================================
  # 2. STAGE PREVIEW: Publish live staging preview to GitHub Pages
  # =========================================================================
  stage-preview:
    name: Publish Staging Preview (GitHub Pages)
    needs: verify-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Staging Artifacts
        run: |
          mkdir -p _site
          if [ -d "dist" ]; then
            cp -r dist/* _site/
          elif [ -d "public" ]; then
            cp -r public/* _site/
          elif [ -f "index.html" ]; then
            cp -r * _site/ 2>/dev/null || true
          else
            cat << 'EOF' > _site/index.html
            <!DOCTYPE html>
            <html>
            <head><title>Staging Preview</title></head>
            <body style="font-family: sans-serif; padding: 2rem;">
              <h1>🚀 Antigravity Staging Preview</h1>
              <p>Automated verification passed for commit <code>${{ github.sha }}</code>.</p>
            </body>
            </html>
          EOF
          fi

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  # =========================================================================
  # 3. RELEASE INTERNAL TEST: Requires 1-Tap Manual Approval via play-internal-test
  # =========================================================================
  release-internal-test:
    name: Deploy to Google Play Internal Test
    needs: [verify-test, stage-preview]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    # Environment with Required Reviewers (e.g. aminniktash2010)
    environment:
      name: play-internal-test
      url: https://play.google.com/console

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Google Play CLI dependencies
        run: pip install cryptography requests google-auth

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/202076903469/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider' }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT || 'play-upload@project-51459e90-fbb3-471f-9f9.iam.gserviceaccount.com' }}
          token_format: "access_token"

      - name: Build Android App Bundle (AAB)
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew bundleRelease || ./gradlew assembleRelease
          else
            echo "Skipping native bundle build (no gradlew found)."
          fi

      - name: Deploy to Google Play Console Internal Developer Test Track
        env:
          INPUT_TRACK: ${{ inputs.track || 'internal' }}
          INPUT_STATUS: ${{ inputs.status || 'completed' }}
          RUN_NUMBER: ${{ github.run_number }}
          PLAY_ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
        run: |
          AAB_FILE=$(find . -name "*.aab" | head -n 1)
          if [ -n "$AAB_FILE" ] && [ -f "tools/play_console_cli.py" ]; then
            echo "Deploying ${AAB_FILE} to Play Console (${INPUT_TRACK})..."
            python3 tools/play_console_cli.py deploy \
              --artifact "$AAB_FILE" \
              --track "${INPUT_TRACK}" \
              --status "${INPUT_STATUS}" \
              --release-name "v1.${RUN_NUMBER}-internal" \
              --notes "Automated Antigravity build approved for internal test."
          elif [ -n "$AAB_FILE" ]; then
            echo "Found bundle ${AAB_FILE}. Ready for internal test release."
          else
            echo "No .aab bundle found. Staged internal test workflow succeeded."
          fi
