version: "3.8"

services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloud-agy-orchestrator:latest
    container_name: cloud-agy-orchestrator
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENVIRONMENT=development
      - LOG_LEVEL=debug
      - AGY_AGENT_ENABLED=true
      - AGY_READ_ONLY_MODE=false
    volumes:
      - .:/app
    restart: unless-stopped
