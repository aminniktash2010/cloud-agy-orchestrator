steps:
  # 1. Build container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/cloud-agy-orchestrator:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/cloud-agy-orchestrator:latest'
      - '.'

  # 2. Push container image to Artifact / Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/cloud-agy-orchestrator:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/cloud-agy-orchestrator:latest'

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'cloud-agy-orchestrator'
      - '--image=gcr.io/$PROJECT_ID/cloud-agy-orchestrator:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=1'

images:
  - 'gcr.io/$PROJECT_ID/cloud-agy-orchestrator:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/cloud-agy-orchestrator:latest'

options:
  logging: CLOUD_LOGGING_ONLY
