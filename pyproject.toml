[project]
name = "cloud-agy-orchestrator"
version = "0.1.0"
description = "Cloud Orchestrator & Agent Service for Google Antigravity (AGY)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Amin Niktash", email = "aminniktash2010@gmail.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "google-auth>=2.35.0",
    "google-cloud-storage>=2.18.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
